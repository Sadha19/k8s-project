apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-components
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [thanos-query, thanos-store-gateway, thanos-compactor]
  endpoints:
    - port: http
      interval: 30s
