
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-worker
  namespace: messaging
  labels:
    app.kubernetes.io/name: task-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: docker-rs
      containers:
        - name: worker
          image: myregistry.com:5000/keda-rabbitmq-worker:2.5
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: QUEUE_NAME
              value: tasks
            - name: DB_HOST
              value: task-ledger-db.messaging.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: task-ledger-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-ledger-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-ledger-db
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

