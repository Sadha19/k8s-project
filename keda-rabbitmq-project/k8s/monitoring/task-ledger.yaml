
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: task-ledger-exporter
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - messaging
  selector:
    matchLabels:
      app: task-ledger-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
